name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: ktlint
        run: ./gradlew --no-daemon ktlintCheck

      - name: Upload ktlint reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ktlint-reports
          path: '**/build/reports/ktlint/'
          if-no-files-found: ignore

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test with coverage
        run: ./gradlew --no-daemon test koverXmlReport koverHtmlReport

      - name: Coverage summary
        if: ${{ !cancelled() }}
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import xml.etree.ElementTree as ET, pathlib, sys
          p = pathlib.Path("build/reports/kover/report.xml")
          if not p.exists():
              print("No coverage report was generated."); sys.exit(0)
          counters = {c.get("type"): (int(c.get("covered")), int(c.get("missed")))
                      for c in ET.parse(p).getroot().findall("counter")}
          print("## Coverage\n")
          print("| Metric | Covered | Total | % |")
          print("|--------|--------:|------:|--:|")
          for t in ("LINE", "BRANCH", "INSTRUCTION", "METHOD", "CLASS"):
              if t not in counters:
                  continue
              covered, missed = counters[t]
              total = covered + missed
              pct = 100.0 * covered / total if total else 100.0
              print(f"| {t.title()} | {covered} | {total} | {pct:.2f}% |")
          PY

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: build/reports/kover/
          if-no-files-found: warn

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/'
          if-no-files-found: ignore

  bytecode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile tsselect-core
        run: ./gradlew --no-daemon :tsselect-core:compileKotlin

      - name: Assert tsselect-core is Java 17 bytecode
        run: |
          python3 - <<'PY'
          import pathlib, struct, sys

          EXPECTED = 61  # class-file major version for Java 17
          root = pathlib.Path("tsselect-core/build/classes/kotlin/main")
          classes = sorted(root.rglob("*.class"))
          if not classes:
              sys.exit(f"No compiled classes found under {root}")

          bad = []
          for c in classes:
              with c.open("rb") as f:
                  magic, _minor, major = struct.unpack(">IHH", f.read(8))
              if magic != 0xCAFEBABE:
                  bad.append((c, f"not a class file (magic={magic:#x})"))
              elif major != EXPECTED:
                  bad.append((c, f"major version {major}, expected {EXPECTED}"))

          for c, why in bad:
              print(f"::error file={c}::{why}")
          if bad:
              sys.exit(f"{len(bad)} of {len(classes)} class file(s) are not Java 17 bytecode")
          print(f"All {len(classes)} class files under {root} are Java 17 (major version {EXPECTED}).")
          PY
